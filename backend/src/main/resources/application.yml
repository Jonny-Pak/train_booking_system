spring:
  application:
    name: ticket-booking
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

booking:
  hold-seconds: ${BOOKING_HOLD_SECONDS:600}
  expiry:
    enabled: ${BOOKING_EXPIRY_ENABLED:true}
    poll-milliseconds: ${BOOKING_EXPIRY_POLL_MILLISECONDS:30000}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ticket-booking
    audience: ticket-booking-api
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
