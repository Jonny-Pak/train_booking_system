# Tests migrate a dedicated real PostgreSQL database, never H2.
spring:
  config:
    import: "optional:file:../.env.test[.properties],optional:file:.env.test[.properties]"
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/ticket_booking_test}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    hikari:
      maximum-pool-size: 4

security:
  jwt:
    # Public test fixture, never accepted as the runtime signing key.
    secret: ${TEST_JWT_SECRET:dGVzdC1vbmx5LXNpZ25pbmcta2V5LTMyaW4tbGVuZ3RoISE=}
